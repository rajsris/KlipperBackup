[gcode_macro START_PRINT]
gcode:
    #Get temperatures and parameters from slicer
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    
    #Heat bed to temp for print
    STATUS_HEATING
    M190 S{BED_TEMP} #Set bed to reach temperature prior to doing anything else including homing
    
    STATUS_HOMING
    G28 #Home all axes (pre-heat nozzle to prevent oozing if desired)

    #Begin heating extruder
    M104 S{EXTRUDER_TEMP} #Set extruder temp but don't block other commands prior to heating
    
    #Z Tilt adjust
    STATUS_LEVELING
    Z_TILT_ADJUST

    #Bed Leveling / Mesh (Optional: Use your specific bed leveling routine here)
    STATUS_MESHING
    BED_MESH_CALIBRATE ADAPTIVE=1  # Uncomment if using saved mesh
    
    STATUS_HEATING
    M109 S{EXTRUDER_TEMP} #Wait for extruder to fully heat up before continuing
    
    STATUS_CLEANING
    LINE_PURGE
    STATUS_PRINTING
    
[gcode_macro END_PRINT]
gcode:
	# Get Boundaries
	{% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
	{% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
	{% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
	
	# Set safety margins (5% from edges)
	{% set x_margin = max_x * 0.05 %}
	{% set y_margin = max_y * 0.05 %}
	
	# Calculate safe parking positions
	{% set safe_x = x_margin %}               # 5% from X=0
	{% set safe_y = max_y - y_margin %}       # 5% from max Y
	
	# Check end position to determine safe directions to move
	{% if printer.toolhead.position.x < (max_x - 20) %}
		{% set x_safe = 20.0 %}
	{% else %}
		{% set x_safe = -20.0 %}
	{% endif %}

	{% if printer.toolhead.position.y < (max_y - 20) %}
		{% set y_safe = 20.0 %}
	{% else %}
		{% set y_safe = -20.0 %}
	{% endif %}

	{% if printer.toolhead.position.z < (max_z - 2) %}
		{% set z_safe = 2.0 %}
	{% else %}
		{% set z_safe = max_z - printer.toolhead.position.z %}
	{% endif %}

	# Commence END_PRINT
	M400                                                          # wait for buffer to clear
	G92 E0                                                        # zero the extruder
	G1 E-3.0 F1800                                               # retract
	G91                                                          # relative positioning
	G0 Z{z_safe} F3600                                           # move nozzle up
	M104 S0                                                      # turn off hotend
	M140 S0                                                      # turn off bed
	M106 S0                                                      # turn off fan
	M107                                                         # turn off part cooling fan
	G90                                                          # absolute positioning
	G1 X{safe_x} Y{safe_y} F2000                                 # move to safe front position

	# Safe Z-drop if near maximum height (after parking)
	{% if printer.toolhead.position.z > (max_z - 20) %}
		G91                                                        # relative positioning
		G1 Z-10 F600                                               # drop 10mm if near the top
		G90                                                        # back to absolute
	{% endif %}
                                       # Displays info on LCD
	STATUS_PART_READY
	UPDATE_DELAYED_GCODE ID=set_ready_status DURATION=60         # Schedule ready status
	UPDATE_DELAYED_GCODE ID=reset_printer_status DURATION=125    # Schedule reset status
	
	# M84                                                        # Disable motors (currently disabled to allow idle timeout)
[delayed_gcode reset_printer_status]
gcode:
    SDCARD_RESET_FILE

[delayed_gcode set_ready_status]
gcode:
  STATUS_READY

[gcode_macro M600]
gcode:
    # Set default parking coordinates if not provided in slicer
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    G91
    G1 E-.8 F2700
    G1 Z{Z} F3000
    G90
    G1 X{X} Y{Y} F3000
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state