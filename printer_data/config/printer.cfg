# This file contains common pin mappings for the BIGTREETECH Manta E3EZ
# To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" "8 MHz crystal"
# and "USB (on PA11/PA12)" or "CAN bus (on PB12/PB13)".

# See docs/Config_Reference.md for a description of parameters.
[include mainsail.cfg]
[include software_options.cfg]
[include Macros.cfg]
[include LED_Effect.cfg]
[include KAMP_Settings.cfg]
[include timelapse.cfg]
#[include LIS2DW.cfg] #For accelerometer testing only, comment out when not used

[stepper_x]
step_pin: PA14
dir_pin: !PA10
enable_pin: !PA13
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC4
position_endstop: 1
position_max: 249
homing_speed: 50

[stepper_y]
step_pin: PC8
dir_pin: !PA15
enable_pin: !PC14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB0
position_endstop: -14
position_max: 232
position_min: -14
homing_speed: 50

[stepper_z]
step_pin: PD2
dir_pin: !PD4
enable_pin: !PD3
microsteps: 16
rotation_distance: 8
#endstop_pin: ^PC6 #Stock z endstop pin
endstop_pin: probe:z_virtual_endstop  # Assigns the virtual pin
#position_endstop: 0
position_min: -5
position_max: 270

[stepper_z1]
step_pin: PB7
dir_pin: !PB6
enable_pin: !PB4
microsteps: 16
rotation_distance: 8

[thermistor Trianglelab-NTC100K-B3950] #Custom thermistor profile for TZ E3 V2.0
temperature1: 25
resistance1: 103180
temperature2: 150
resistance2: 1366.2
temperature3: 250
resistance3: 168.6

[extruder]
step_pin: PD5
dir_pin: PD6
enable_pin: !PB3
microsteps: 16
rotation_distance: 22.651
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB11 #HE0
#sensor_type: EPCOS 100K B57560G104F #Stock Ender3
#sensor_type: ATC Semitec 104NT-4-R025H42G #Alternative for TZ E3 V2.0 hotend
sensor_type: Trianglelab-NTC100K-B3950 #Custom thermistor profile for TZ E3 V2.0 hotend
sensor_pin: TH1 #TH0
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 310
max_extrude_cross_section: 5
pressure_advance: 0.05
max_extrude_only_distance: 150

[heater_bed]
heater_pin: PB2 #HB
sensor_type: EPCOS 100K B57560G104F #Stock Ender3 thermistor for bed heater
sensor_pin: TB #TB
#control: pid
# tuned for stock hardware with 50 degree Celsius target
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 130

[output_pin probe_enable]
pin: PA7
value: 0

[gcode_macro Probe_Deploy]
gcode:
    SET_PIN PIN=probe_enable VALUE=1

[gcode_macro Probe_Stow]
gcode:
    SET_PIN PIN=probe_enable VALUE=0

[probe]
pin: ^!PA6
deactivate_on_each_sample: False
speed: 5.0
activate_gcode:
    Probe_Deploy
    G4 P500 #Allow 500 ms for the probe to deploy
deactivate_gcode:
    Probe_Stow
x_offset: -42
y_offset: -5
#z_offset: 0

[temperature_sensor MantaE3EZ]
sensor_type: temperature_mcu

[heater_fan Hotend]
pin: FAN_0
heater: extruder
heater_temp: 50

[fan]
pin: FAN_1

[temperature_fan MainBoard]
pin: FAN_2
sensor_type: temperature_host
min_temp: 0
max_temp: 80
target_temp: 60
control: watermark

[filament_switch_sensor Filament_Sensor]
switch_pin: ^PC5
pause_on_runout: True
runout_gcode:
    PAUSE
    M117 Filament runout detected!
insert_gcode:
    M117 Filament inserted!


[neopixel Ender]
pin: RGB
chain_count: 15
color_order: GRB

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_4C002A001850425938323120-if00

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

########################################
# TMC2209 configuration
########################################

[tmc2209 stepper_x]
uart_pin: PB8
##diag_pin: PC4
run_current: 0.800
stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: PC9
##diag_pin: PB0
run_current: 0.800
stealthchop_threshold: 999999

[tmc2209 stepper_z]
uart_pin: PD0
#diag_pin: PC6
run_current: 0.650
stealthchop_threshold: 999999

[tmc2209 stepper_z1]
uart_pin: PB5
run_current: 0.650
stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: PD1
run_current: 0.800
stealthchop_threshold: 999999

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PC1, EXP1_3=PC3, EXP1_5=PC0, EXP1_7=PA2, EXP1_9=<GND>,
    EXP1_2=PC2, EXP1_4=<RST>, EXP1_6=PA0, EXP1_8=PA1, EXP1_10=<5V>,
    FAN_0=PA8, FAN_1=PB15, FAN_2=PB14, RGB=PC7, TH1=PA5, TB=PA3,
    FIL=PC5

[display]
lcd_type: st7920
cs_pin: EXP1_7
sclk_pin: EXP1_6
sid_pin: EXP1_8
encoder_pins: ^EXP1_5, ^EXP1_3
click_pin: ^!EXP1_2

[output_pin beeper]
pin: EXP1_1

[exclude_object]
