[safe_z_home]
home_xy_position: 159.5, 124.5  # Replace with the exact center of your bed (e.g., 115, 115 for an Ender 3)
speed: 100.0
z_hop: 5.0                         # Distance the Z-axis lifts before moving (in mm)

[exclude_object]

[firmware_retraction]
retract_length: 0.3
#   The length of filament (in mm) to retract when G10 is activated,
#   and to unretract when G11 is activated (but see
#   unretract_extra_length below). The default is 0 mm.
retract_speed: 40
#   The speed of retraction, in mm/s. The default is 20 mm/s.
#unretract_extra_length: 0
#   The length (in mm) of *additional* filament to add when
#   unretracting.
#unretract_speed: 10
#   The speed of unretraction, in mm/s. The default is 10 mm/s.


[z_tilt]
z_positions:
    -26, 95
    262, 86
points:
    # Probe points on the bed (these should be accessible by your Z-probe offset)
    47, 95
    245, 86
speed: 100
horizontal_move_z: 5
retries: 3
retry_tolerance: 0.02
speed: 100

[bed_screws]
screw1: 31, 213
screw1_name: rear left screw
screw2: 200, 213
screw2_name: rear right screw
screw3: 201, 44
screw3_name: front right screw
screw4: 31, 43
screw4_name: front left screw
speed: 100
horizontal_move_z: 5

[screws_tilt_adjust]
screw1: 73, 208              # Rear-left screw (Reference point)
screw1_name: rear left
screw2: 242, 208              # Rear-right screw
screw2_name: rear right
screw3: 243, 39             # Front-right screw
screw3_name: front right
screw4: 73, 38              # Front-left screw
screw4_name: front left
horizontal_move_z: 5
speed: 100
screw_thread: CW-M3          # Standard clockwise M3 threads

[bed_mesh]
speed: 100
horizontal_move_z: 5
mesh_min: 5, 5
mesh_max: 205, 225
probe_count: 5, 5
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

[input_shaper]
shaper_freq_x: 87.2
shaper_type_x: 2hump_ei
shaper_freq_y: 40.4
shaper_type_y: 2hump_ei

[verify_heater extruder]
max_error: 240
hysteresis: 10

[idle_timeout]
timeout: 21600  # Sets pause timeout to 6 hours

### Section for running automated Git backups of entire printer_data config folder
[gcode_macro update_git]
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh -c \"$0\""
timeout: 90.0
verbose: True